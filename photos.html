<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Street Observations - Photo Gallery</title>
  
  <!-- Google Pixel Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css?v=37">

  <style>
    /* Directe Grid-opmaak voor betrouwbare weergave */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 15px;
      padding: 20px;
    }
    .gallery-item {
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #111;
      border: 1px solid #333;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Navigation Drawer (Hamburger Menu) -->
  <nav class="nav-drawer" id="nav-drawer">
    <button class="drawer-close" id="close-drawer" aria-label="Close Menu">&times;</button>
    <div class="drawer-title">NAVIGATION</div>
    <ul class="drawer-links">
      <li><a href="index.html" id="link-index">Typography Log</a></li>
      <li><a href="photos.html" class="active">Photo Gallery</a></li>
      <li><a href="#">Archive</a></li>
    </ul>
  </nav>

  <!-- Top Control Bar (Minimalist) -->
  <header class="control-panel">
    <div class="panel-left">
      <button class="btn btn-icon" id="menu-toggle" aria-label="Open Menu">
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
      </button>
      <span class="panel-brand">STREET OBSERVATIONS — GALLERY</span>
    </div>
  </header>

  <!-- Gallery Main Container -->
  <main class="gallery-container">
    <div class="gallery-header-actions" style="padding: 15px 20px 0;">
      <input type="file" id="file-input" accept="image/*" style="display: none;" multiple>
      <button class="btn btn-primary" id="trigger-upload-btn" style="font-size: 0.85rem; padding: 10px 18px;">+ UPLOAD PHOTO</button>
    </div>

    <!-- Gallery Grid -->
    <div class="gallery-grid" id="gallery-grid"></div>
  </main>

  <!-- Modal: Photo Viewer / Details -->
  <div class="modal-overlay hidden" id="photo-modal">
    <div class="modal-card photo-modal-card">
      <img id="modal-img" src="" alt="Enlarged Observation Photo" style="width: 100%; max-height: 60vh; object-fit: contain; margin-bottom: 15px;">
      <div class="form-actions" style="justify-content: space-between; align-items: center;">
        <button type="button" class="btn btn-danger" id="delete-photo-btn">DELETE PHOTO</button>
        <button type="button" class="btn" id="close-photo-modal">CLOSE</button>
      </div>
    </div>
  </div>

  <script>
    // 1. HAMBURGER MENU & NAVIGATIE (Stripprijs-vrij en direct werkend)
    const menuToggle = document.getElementById("menu-toggle");
    const navDrawer = document.getElementById("nav-drawer");
    const closeDrawer = document.getElementById("close-drawer");

    if (menuToggle && navDrawer) {
      menuToggle.onclick = function(e) {
        e.stopPropagation();
        navDrawer.classList.toggle("open");
      };
    }

    if (closeDrawer && navDrawer) {
      closeDrawer.onclick = function() {
        navDrawer.classList.remove("open");
      };
    }

    // Directe klik op de link naar index.html forceert de navigatie
    const linkIndex = document.getElementById("link-index");
    if (linkIndex) {
      linkIndex.onclick = function() {
        window.location.href = "index.html";
      };
    }

    // 2. FOTOGALERIJ LOGICA
    document.addEventListener("DOMContentLoaded", function() {
      const galleryGrid = document.getElementById("gallery-grid");
      const fileInput = document.getElementById("file-input");
      const triggerUploadBtn = document.getElementById("trigger-upload-btn");
      const photoModal = document.getElementById("photo-modal");
      const modalImg = document.getElementById("modal-img");
      const closePhotoModalBtn = document.getElementById("close-photo-modal");
      const deletePhotoBtn = document.getElementById("delete-photo-btn");

      // Maak lijst aan van vaste bestanden
      const defaultPhotos = [];
      for (let i = 1; i <= 10; i++) {
        defaultPhotos.push("beeld/Artboard " + i + ".jpg");
      }

      let localPhotos = [];
      try {
        localPhotos = JSON.parse(localStorage.getItem("street_observation_photos")) || [];
      } catch (e) {
        localPhotos = [];
      }

      let photos = defaultPhotos.concat(localPhotos);
      let selectedPhotoIndex = null;

      function renderGallery() {
        if (!galleryGrid) return;
        galleryGrid.innerHTML = "";

        photos.forEach(function(photoSrc, index) {
          const itemDiv = document.createElement("div");
          itemDiv.className = "gallery-item";

          const img = document.createElement("img");
          img.alt = "Observation " + (index + 1);

          if (index < defaultPhotos.length) {
            // Vaste map foto
            img.src = encodeURI(photoSrc);

            // Probeer alternatieve extensies/paden als het bestand niet laadt
            img.onerror = function() {
              if (this.src.indexOf("%20") !== -1) {
                // Probeer met gewone spatie
                this.src = photoSrc;
              } else if (this.src.indexOf(".jpg") !== -1) {
                // Probeer hoofdletters .JPG
                this.src = photoSrc.replace(".jpg", ".JPG");
              } else {
                // Bestaat niet, verberg het vakje
                itemDiv.style.display = "none";
              }
            };
          } else {
            // Lokaal geüploade foto
            img.src = photoSrc;
          }

          itemDiv.appendChild(img);

          itemDiv.onclick = function() {
            selectedPhotoIndex = index;
            modalImg.src = img.src;
            photoModal.classList.remove("hidden");
          };

          galleryGrid.appendChild(itemDiv);
        });
      }

      // Upload knop
      if (triggerUploadBtn && fileInput) {
        triggerUploadBtn.onclick = function() {
          fileInput.click();
        };

        fileInput.onchange = async function(e) {
          const files = e.target.files;
          if (!files || files.length === 0) return;

          const newPhotos = [];
          for (let file of Array.from(files)) {
            try {
              const compressed = await compressImage(file);
              newPhotos.push(compressed);
            } catch (err) {
              console.error(err);
            }
          }

          try {
            localPhotos = localPhotos.concat(newPhotos);
            localStorage.setItem("street_observation_photos", JSON.stringify(localPhotos));
            photos = defaultPhotos.concat(localPhotos);
            renderGallery();
          } catch (error) {
            alert("Geheugen vol! Verwijder enkele lokaal geüploade foto's.");
          }
          fileInput.value = "";
        };
      }

      function compressImage(file, maxWidth = 1200, quality = 0.7) {
        return new Promise(function(resolve) {
          const reader = new FileReader();
          reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
              const canvas = document.createElement("canvas");
              let width = img.width;
              let height = img.height;
              if (width > maxWidth) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
              }
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext("2d");
              ctx.drawImage(img, 0, 0, width, height);
              resolve(canvas.toDataURL("image/jpeg", quality));
            };
            img.src = e.target.result;
          };
          reader.readAsDataURL(file);
        });
      }

      // Modal sluiten & verwijderen
      if (deletePhotoBtn) {
        deletePhotoBtn.onclick = function() {
          if (selectedPhotoIndex !== null) {
            const localIndex = selectedPhotoIndex - defaultPhotos.length;
            if (localIndex >= 0) {
              localPhotos.splice(localIndex, 1);
              localStorage.setItem("street_observation_photos", JSON.stringify(localPhotos));
              photos = defaultPhotos.concat(localPhotos);
            } else {
              alert("Vaste foto's uit de map 'beeld' kunnen niet via de browser worden verwijderd.");
            }
            selectedPhotoIndex = null;
            photoModal.classList.add("hidden");
            renderGallery();
          }
        };
      }

      if (closePhotoModalBtn) {
        closePhotoModalBtn.onclick = function() {
          photoModal.classList.add("hidden");
          selectedPhotoIndex = null;
        };
      }

      renderGallery();
    });
  </script>
</body>
</html>
