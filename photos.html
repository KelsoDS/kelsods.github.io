<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>Street Observations - Photo Gallery</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-gallery">

  <!-- Drawer Overlay -->
  <div class="drawer-overlay" id="drawer-overlay"></div>

  <!-- Navigation Drawer (Identiek aan index.html) -->
  <nav class="nav-drawer" id="nav-drawer">
    <button class="drawer-close" id="close-drawer" aria-label="Close Menu">&times;</button>
    <div class="drawer-title">NAVIGATION</div>
    <ul class="drawer-links">
      <li><a href="index.html">Typography Log</a></li>
      <li><a href="photos.html" class="active">Photo Gallery</a></li>
      <li><a href="editie-05.html">Editie 05</a></li>
    </ul>
  </nav>

  <!-- Top Control Bar -->
  <header class="control-panel">
    <div class="panel-left">
      <button class="btn btn-icon" id="menu-toggle" aria-label="Open Menu">
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
      </button>
      <span class="panel-brand">STREET OBSERVATIONS</span>
    </div>
    <div class="panel-actions">
      <input type="file" id="file-input" accept="image/*" style="display: none;" multiple>
      <button class="btn btn-primary" id="trigger-upload-btn">+ UPLOAD PHOTO</button>
    </div>
  </header>

  <!-- Gallery Main Container -->
  <main class="gallery-container">
    <div class="gallery-grid" id="gallery-grid"></div>
  </main>

  <!-- Modal: Photo Viewer / Details -->
  <div class="modal-overlay hidden" id="photo-modal">
    <div class="modal-card">
      <img id="modal-img" src="" alt="Enlarged Observation Photo" class="modal-preview-img">
      <div class="form-actions">
        <button type="button" class="btn btn-danger" id="delete-photo-btn">DELETE PHOTO</button>
        <button type="button" class="btn" id="close-photo-modal">CLOSE</button>
      </div>
    </div>
  </div>

  <!-- Modal: GitHub Sync Instellingen -->
  <div class="modal-overlay hidden" id="github-modal">
    <div class="modal-card">
      <h2>GITHUB PUBLIEKE OPSLAG</h2>
      <p class="detail-text" style="font-size: 0.8rem; color: #aaa; margin-bottom: 10px;">
        Vul dit eenmalig in op jouw toestel zodat nieuwe foto's automatisch naar GitHub worden geüpload voor alle bezoekers.
      </p>
      <form id="github-settings-form">
        <label for="gh-owner">GITHUB GEBRUIKERSNAAM</label>
        <input type="text" id="gh-owner" required placeholder="bijv. jouw-naam">

        <label for="gh-repo">REPOSITORY NAAM</label>
        <input type="text" id="gh-repo" required placeholder="bijv. street-observations">

        <label for="gh-branch">BRANCH (MEESTAL main)</label>
        <input type="text" id="gh-branch" value="main" required>

        <label for="gh-token">PERSONAL ACCESS TOKEN (CONTENTS: READ & WRITE)</label>
        <input type="password" id="gh-token" required placeholder="github_pat_...">

        <div class="form-actions">
          <button type="button" class="btn" id="close-github-modal">SLUITEN</button>
          <button type="submit" class="btn btn-primary">OPSLAAN</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Melding / Status -->
  <div class="modal-overlay hidden" id="notice-modal">
    <div class="modal-card">
      <p id="notice-message" class="detail-text"></p>
      <div class="form-actions" style="justify-content: flex-end;">
        <button type="button" class="btn btn-primary" id="close-notice-btn">OK</button>
      </div>
    </div>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
