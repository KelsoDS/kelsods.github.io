<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Street Observations - Photo Gallery</title>

  <!-- Google Pixel Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <!-- Global Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-gallery">

  <!-- Overlay for drawer menu -->
  <div class="drawer-overlay" id="drawer-overlay"></div>

  <!-- Navigation Drawer (Hamburger Menu) -->
  <nav class="nav-drawer" id="nav-drawer" aria-label="Hoofdnavigatie">
    <button class="drawer-close" id="close-drawer" aria-label="Sluit menu">&times;</button>
    <div class="drawer-header">
      <div class="drawer-title">STREET LOGS</div>
      <div class="drawer-subtitle">URBAN OBSERVATION ARCHIVE</div>
    </div>

    <ul class="drawer-links">
      <li><a href="index.html" id="btn-to-index"><span>01</span> TYPOGRAPHY LOG</a></li>
      <li><a href="photos.html" class="active" id="nav-photos"><span>02</span> PHOTO GALLERY</a></li>
      <li><a href="#" id="nav-archive"><span>03</span> ARCHIVE</a></li>
    </ul>

    <div class="drawer-footer">
      <span class="log-counter">LOGS ACTIEF: <strong id="drawer-log-count">0</strong></span>
    </div>
  </nav>

  <!-- Top Control Bar -->
  <header class="control-panel">
    <div class="panel-left">
      <button class="btn btn-icon" id="menu-toggle" aria-label="Open menu">
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
      </button>
      <span class="panel-brand">STREET OBSERVATIONS</span>
    </div>
  </header>

  <!-- Gallery Main Container -->
  <main class="gallery-container">
    <div class="gallery-header-actions">
      <input type="file" id="file-input" accept="image/*" style="display: none;" multiple>
      <button class="btn btn-primary" id="trigger-upload-btn">+ UPLOAD PHOTO</button>
    </div>

    <!-- Gallery Grid -->
    <div class="gallery-grid" id="gallery-grid"></div>
  </main>

  <!-- Modal: Photo Viewer / Details -->
  <div class="modal-overlay hidden" id="photo-modal">
    <div class="modal-card">
      <img id="modal-img" src="" alt="Enlarged Observation Photo" class="modal-preview-img">
      <div class="form-actions info-actions">
        <button type="button" class="btn btn-danger" id="delete-photo-btn">DELETE PHOTO</button>
        <button type="button" class="btn" id="close-photo-modal">CLOSE</button>
      </div>
    </div>
  </div>

  <!-- Modal: Custom Notice -->
  <div class="modal-overlay hidden" id="notice-modal">
    <div class="modal-card modal-notice-card">
      <div class="notice-title">NOTICE</div>
      <p id="notice-message" class="notice-text"></p>
      <div class="form-actions">
        <button type="button" class="btn btn-primary" id="close-notice-btn">OK</button>
      </div>
    </div>
  </div>

  <!-- Global Application Logic -->
  <script src="script.js" defer></script>
</body>
</html>
