<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>Street Observations - Photo Gallery</title>
  
  <!-- Google Pixel Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css?v=32">
</head>
<body>

  <!-- Navigation Drawer (Hamburger Menu) -->
  <nav class="nav-drawer" id="nav-drawer">
    <button class="drawer-close" id="close-drawer" aria-label="Close Menu">&times;</button>
    <div class="drawer-title">NAVIGATION</div>
    <ul class="drawer-links">
      <li><a href="index.html">Typography Log</a></li>
      <li><a href="photos.html" class="active">Photo Gallery</a></li>
      <li><a href="#">Archive</a></li>
    </ul>
  </nav>

  <!-- Top Control Bar (Minimalist) -->
  <header class="control-panel">
    <div class="panel-left">
      <button class="btn btn-icon" id="menu-toggle" aria-label="Open Menu">
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
      </button>
      <span class="panel-brand">STREET OBSERVATIONS — GALLERY</span>
    </div>
  </header>

  <!-- Gallery Main Container -->
  <main class="gallery-container">
    <div class="gallery-header-actions">
      <!-- File input met 'multiple' om meerdere foto's tegelijk te selecteren -->
      <input type="file" id="file-input" accept="image/*" style="display: none;" multiple>
      <button class="btn btn-primary" id="trigger-upload-btn" style="font-size: 0.85rem; padding: 10px 18px;">+ UPLOAD PHOTO</button>
    </div>

    <!-- Gallery Grid -->
    <div class="gallery-grid" id="gallery-grid">
      <!-- Dynamic photos will appear here -->
    </div>
  </main>

  <!-- Modal: Photo Viewer / Details -->
  <div class="modal-overlay hidden" id="photo-modal">
    <div class="modal-card photo-modal-card">
      <img id="modal-img" src="" alt="Enlarged Observation Photo" style="width: 100%; max-height: 60vh; object-fit: contain; margin-bottom: 15px;">
      <div class="form-actions" style="justify-content: space-between; align-items: center;">
        <button type="button" class="btn btn-danger" id="delete-photo-btn">DELETE PHOTO</button>
        <button type="button" class="btn" id="close-photo-modal">CLOSE</button>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Menu drawer toggle
      const menuToggle = document.getElementById("menu-toggle");
      const navDrawer = document.getElementById("nav-drawer");
      const closeDrawer = document.getElementById("close-drawer");

      if (navDrawer) navDrawer.classList.remove("open");

      if (menuToggle && navDrawer) {
        menuToggle.addEventListener("click", (e) => {
          e.stopPropagation();
          navDrawer.classList.toggle("open");
        });
      }

      if (closeDrawer && navDrawer) {
        closeDrawer.addEventListener("click", () => {
          navDrawer.classList.remove("open");
        });
      }

      document.addEventListener("click", (e) => {
        if (navDrawer && navDrawer.classList.contains("open")) {
          if (!navDrawer.contains(e.target) && !menuToggle.contains(e.target)) {
            navDrawer.classList.remove("open");
          }
        }
      });

      // 1. Vaste foto's uit de map "beeld" (zichtbaar op elk apparaat)
      const defaultPhotos = [
        "beeld/Artboard 1.jpg",
        "beeld/Artboard 2.jpg"
        "beeld/Artboard 3.jpg"
        "beeld/Artboard 4.jpg"
        "beeld/Artboard 5.jpg"
        "beeld/Artboard 6.jpg"
        "beeld/Artboard 7.jpg"
        "beeld/Artboard 8.jpg"
        "beeld/Artboard 9.jpg"
        "beeld/Artboard 10.jpg"
      ];

      // 2. Extra lokale uploads uit localStorage
      let localPhotos = JSON.parse(localStorage.getItem("street_observation_photos")) || [];
      
      // 3. Combineer vaste map-foto's en lokale uploads samen
      let photos = defaultPhotos.concat(localPhotos);
      let selectedPhotoIndex = null;

      const galleryGrid = document.getElementById("gallery-grid");
      const fileInput = document.getElementById("file-input");
      const triggerUploadBtn = document.getElementById("trigger-upload-btn");
      
      const photoModal = document.getElementById("photo-modal");
      const modalImg = document.getElementById("modal-img");
      const closePhotoModalBtn = document.getElementById("close-photo-modal");
      const deletePhotoBtn = document.getElementById("delete-photo-btn");

      function renderGallery() {
        galleryGrid.innerHTML = "";

        if (photos.length === 0) {
          galleryGrid.innerHTML = `<div style="font-family: monospace; color: #777; text-align: center; width: 100%; grid-column: 1 / -1; margin-top: 15vh;">NO PHOTOS AVAILABLE.</div>`;
          return;
        }

        photos.forEach((photoSrc, index) => {
          const itemDiv = document.createElement("div");
          itemDiv.className = "gallery-item";
          itemDiv.style.backgroundImage = `url(${photoSrc})`;

          itemDiv.addEventListener("click", () => {
            selectedPhotoIndex = index;
            modalImg.src = photoSrc;
            photoModal.classList.remove("hidden");
          });

          galleryGrid.appendChild(itemDiv);
        });
      }

      // Trigger file selector
      triggerUploadBtn.addEventListener("click", () => {
        fileInput.click();
      });

      // Hulpfunctie om foto's automatisch te verkleinen voor opslag
      function compressImage(file, maxWidth = 1200, quality = 0.7) {
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
              const canvas = document.createElement("canvas");
              let width = img.width;
              let height = img.height;

              if (width > maxWidth) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
              }

              canvas.width = width;
              canvas.height = height;

              const ctx = canvas.getContext("2d");
              ctx.drawImage(img, 0, 0, width, height);

              resolve(canvas.toDataURL("image/jpeg", quality));
            };
            img.src = e.target.result;
          };
          reader.readAsDataURL(file);
        });
      }

      // Handle file uploads met automatische compressie
      fileInput.addEventListener("change", async (e) => {
        const files = e.target.files;
        if (!files || files.length === 0) return;

        const newPhotos = [];

        for (let file of Array.from(files)) {
          try {
            const compressedDataUrl = await compressImage(file);
            newPhotos.push(compressedDataUrl);
          } catch (err) {
            console.error("Fout bij comprimeren van foto:", err);
          }
        }

        try {
          localPhotos = localPhotos.concat(newPhotos);
          localStorage.setItem("street_observation_photos", JSON.stringify(localPhotos));
          photos = defaultPhotos.concat(localPhotos);
          renderGallery();
        } catch (error) {
          alert("Het geheugen van de browser zit vol! Verwijder een paar lokaal geüploade foto's om nieuwe toe te kunnen voegen.");
        }

        fileInput.value = "";
      });

      // Delete photo (let op: verwijdert alleen lokaal geüploade foto's uit localStorage, vaste map-foto's blijven)
      deletePhotoBtn.addEventListener("click", () => {
        if (selectedPhotoIndex !== null) {
          // Check of het een lokale foto is (index valt buiten defaultPhotos)
          const localIndex = selectedPhotoIndex - defaultPhotos.length;
          
          if (localIndex >= 0) {
            localPhotos.splice(localIndex, 1);
            localStorage.setItem("street_observation_photos", JSON.stringify(localPhotos));
            photos = defaultPhotos.concat(localPhotos);
          } else {
            alert("Dit is een vaste foto uit de map 'beeld' en kan niet worden verwijderd via de browser.");
          }

          selectedPhotoIndex = null;
          photoModal.classList.add("hidden");
          renderGallery();
        }
      });

      closePhotoModalBtn.addEventListener("click", () => {
        photoModal.classList.add("hidden");
        selectedPhotoIndex = null;
      });

      renderGallery();
    });
  </script>
</body>
</html>
