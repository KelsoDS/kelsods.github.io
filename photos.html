<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>Street Observations - Photo Gallery</title>
  
  <!-- Google Pixel Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css?v=45">
</head>
<body>

  <!-- Navigation Drawer (Hamburger Menu) -->
  <nav class="nav-drawer" id="nav-drawer">
    <button class="drawer-close" id="close-drawer" aria-label="Close Menu">&times;</button>
    <div class="drawer-title">NAVIGATION</div>
    <ul class="drawer-links">
      <li><a href="index.html" id="btn-to-index">Typography Log</a></li>
      <li><a href="photos.html" class="active">Photo Gallery</a></li>
      <li><a href="#">Archive</a></li>
    </ul>
  </nav>

  <!-- Top Control Bar -->
  <header class="control-panel">
    <div class="panel-left">
      <button class="btn btn-icon" id="menu-toggle" aria-label="Open Menu">
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
      </button>
      <span class="panel-brand">STREET OBSERVATIONS — GALLERY</span>
    </div>
  </header>

  <!-- Gallery Main Container -->
  <main class="gallery-container">
    <div class="gallery-header-actions" style="padding: 15px 20px;">
      <input type="file" id="file-input" accept="image/*" style="display: none;" multiple>
      <button class="btn btn-primary" id="trigger-upload-btn" style="font-size: 0.85rem; padding: 10px 18px;">+ UPLOAD PHOTO</button>
    </div>

    <!-- Gallery Grid -->
    <div class="gallery-grid" id="gallery-grid"></div>
  </main>

  <!-- Modal: Photo Viewer / Details -->
  <div class="modal-overlay hidden" id="photo-modal">
    <div class="modal-card">
      <img id="modal-img" src="" alt="Enlarged Observation Photo" style="width: 100%; max-height: 60vh; object-fit: contain; margin-bottom: 15px; display: block;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <button type="button" class="btn btn-danger" id="delete-photo-btn">DELETE PHOTO</button>
        <button type="button" class="btn" id="close-photo-modal">CLOSE</button>
      </div>
    </div>
  </div>

  <!-- Gekoppeld aan het externe script.js bestand -->
  <script src="script.js?v=45"></script>
</body>
</html>
