<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Street Observation Log — a typographic archive of urban movement and behavior."
    />
    <title>Street Observation Log</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700;900&family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <!-- Zwevende Besturing met Navigatie -->
  <header class="control-panel">
    <div class="panel-brand">OBSERVATIE LOG v1.0</div>
    <div class="panel-actions">
      <a href="index.html" class="btn btn-primary"> Typografie</a>
      <a href="photos.html" class="btn"> Foto's</a>
      <button id="toggle-style" class="btn">Contour / Gevuld</button>
      <button id="toggle-drift" class="btn">Projectie</button>
      <button id="toggle-modal" class="btn">+ Nieuw</button>
    </div>
  </header>

      <div class="panel-actions" aria-label="Page controls">
        <button id="toggle-style" type="button" class="btn">
          <i class="fa-solid fa-font"></i>
          <span>Mode: <strong id="style-label">OUTLINE</strong></span>
        </button>

        <button id="toggle-drift" type="button" class="btn">
          <i class="fa-solid fa-water"></i>
          <span>Motion: <strong id="drift-label">OFF</strong></span>
        </button>

        <button id="toggle-beamer" type="button" class="btn btn-primary">
          <i class="fa-solid fa-expand"></i>
          <span id="beamer-label">BEAMER MODE</span>
        </button>

        <button id="toggle-modal" type="button" class="btn btn-add">
          <i class="fa-solid fa-plus"></i>
          <span>ADD LOG</span>
        </button>
      </div>
    </header>

    <section class="toolbar">
      <div class="search-wrap">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input
          id="search-input"
          type="text"
          aria-label="Search observations"
          placeholder="Search entries, days, keywords..."
        />
      </div>

      <div class="toolbar-meta">
        <span>SHOWING: <strong id="log-count">0</strong> ENTRIES</span>
        <button id="reset-search" type="button" class="reset-link hidden">RESET FILTER</button>
      </div>
    </section>

    <main id="log-display" class="typography-container" aria-live="polite"></main>

    <footer class="site-footer">
      <div>Hover or tap any word block to inspect the observation context.</div>
      <div class="footer-right">
        <span>Urban index / archive</span>
        <span class="divider">|</span>
        <span id="current-time">00:00:00 UTC</span>
      </div>
    </footer>

    <div id="observation-modal" class="modal-overlay hidden" role="dialog" aria-modal="true">
      <div class="modal-card">
        <button id="close-modal" type="button" class="close-modal" aria-label="Close add log form">
          <i class="fa-solid fa-xmark"></i>
        </button>

        <h2>NEW OBSERVATION LOG</h2>

        <form id="add-log-form">
          <div class="form-grid">
            <div>
              <label for="input-day">DAY</label>
              <input id="input-day" type="text" placeholder="MON" required />
            </div>
            <div>
              <label for="input-date">DATE</label>
              <input id="input-date" type="text" placeholder="5 OCT" required />
            </div>
          </div>

          <label for="input-time">TIME</label>
          <input id="input-time" type="text" placeholder="2AM" required />

          <label for="input-people">PEOPLE & DIRECTION</label>
          <input id="input-people" type="text" placeholder="5 PEOPLE WALKING NORTH TO SOUTH" required />

          <label for="input-details">OBSERVED BEHAVIOR</label>
          <textarea id="input-details" rows="4" placeholder="YELLING AND SINGING LOUD" required></textarea>

          <label for="input-scale">FONT SCALE</label>
          <select id="input-scale">
            <option value="dynamic-text-lg">X-Large Bold Fill</option>
            <option value="dynamic-text-md" selected>Medium Standard</option>
            <option value="dynamic-text-sm">Small Compact</option>
          </select>

          <div class="form-actions">
            <button type="button" class="btn" id="cancel-modal">Cancel</button>
            <button type="submit" class="btn btn-primary">ADD ENTRY</button>
          </div>
        </form>
      </div>
    </div>

    <div id="detail-modal" class="detail-overlay hidden" role="dialog" aria-modal="true">
      <div class="detail-card">
        <button id="close-detail-modal" type="button" class="close-modal" aria-label="Close detail view">
          <i class="fa-solid fa-xmark"></i>
        </button>

        <div class="detail-label">[LOG ENTRY DETAILS]</div>
        <h3 id="detail-timestamp"></h3>
        <div id="detail-content" class="detail-content"></div>

        <div class="detail-grid">
          <div>
            <span class="muted-label">OBSERVATION TYPE:</span>
            <span>Street Passerby Activity</span>
          </div>
          <div>
            <span class="muted-label">GRID SIZE:</span>
            <span id="detail-scale-label">FLOW</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
