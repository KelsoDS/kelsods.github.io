<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Street Observations - Typography Log</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden !important;
      background-color: #050505;
      color: #ffffff;
      font-family: Impact, 'Arial Black', sans-serif;
      display: flex;
      flex-direction: column;
    }

    /* Control Panel / Header */
    .control-panel {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      padding: 10px 20px;
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #222222;
    }

    .panel-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .panel-brand {
      font-family: monospace;
      font-size: 0.85rem;
      letter-spacing: 2px;
      color: #888888;
      font-weight: bold;
    }

    .panel-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    /* Buttons */
    .btn {
      background: #121212;
      color: #ffffff;
      border: 1px solid #333333;
      padding: 8px 14px;
      font-family: monospace;
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
      border-radius: 2px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .btn:hover {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
    }

    .btn.active-mode {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
    }

    .btn-primary {
      border-color: #ffffff;
      background: #222222;
    }

    .btn-danger {
      border-color: #ff3333;
      color: #ff3333;
      background: rgba(255, 51, 51, 0.05);
    }

    .btn-danger:hover {
      background: #ff3333;
      color: #ffffff;
    }

    /* Hamburger Icon Button */
    .btn-icon {
      padding: 8px 10px;
      flex-direction: column;
      gap: 4px;
      background: #111;
      border: 1px solid #333;
      cursor: pointer;
    }

    .hamburger-bar {
      display: block;
      width: 18px;
      height: 2px;
      background-color: #ffffff;
      transition: background-color 0.2s;
    }

    .btn-icon:hover .hamburger-bar {
      background-color: #000000;
    }

    /* Drawer Overlay */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .drawer-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Navigation Drawer */
    .nav-drawer {
      position: fixed;
      top: 0;
      left: 0;
      width: 320px;
      max-width: 85vw;
      height: 100vh;
      background: #0d0d0d;
      border-right: 1px solid #222222;
      z-index: 2500;
      padding: 30px 25px;
      display: flex;
      flex-direction: column;
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .nav-drawer.open {
      transform: translateX(0);
    }

    .drawer-close {
      position: absolute;
      top: 15px;
      right: 20px;
      background: none;
      border: none;
      color: #888888;
      font-size: 2rem;
      cursor: pointer;
      line-height: 1;
      transition: color 0.2s;
    }

    .drawer-close:hover {
      color: #ffffff;
    }

    .drawer-header {
      margin-top: 20px;
      margin-bottom: 30px;
    }

    .drawer-title {
      font-family: Impact, sans-serif;
      font-size: 1.5rem;
      letter-spacing: 2px;
      color: #ffffff;
    }

    .drawer-subtitle {
      font-family: monospace;
      font-size: 0.7rem;
      color: #ff3333;
      margin-top: 4px;
    }

    .drawer-links {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .drawer-links a {
      color: #888888;
      text-decoration: none;
      font-family: monospace;
      font-size: 0.9rem;
      letter-spacing: 1px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .drawer-links a span {
      color: #444;
      font-size: 0.75rem;
    }

    .drawer-links a:hover,
    .drawer-links a.active {
      color: #ffffff;
    }

    .drawer-links a.active span {
      color: #ff3333;
    }

    .drawer-footer {
      margin-top: auto;
      padding-top: 20px;
      border-top: 1px solid #222;
      font-family: monospace;
      font-size: 0.75rem;
      color: #666;
    }

    /* Typography Canvas */
    .typography-container {
      margin-top: 60px;
      min-height: calc(100vh - 60px);
      width: 100vw;
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: stretch;
      overflow-y: auto;
      overflow-x: hidden;
      gap: 15px;
    }

    .log-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      line-height: 0.9;
      row-gap: 5px;
    }

    .log-word {
      font-size: var(--dynamic-font-size, 3.5rem);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: transparent;
      -webkit-text-stroke: 1.5px #ffffff;
      transition: color 0.15s ease, -webkit-text-stroke 0.15s ease, text-shadow 0.15s ease;
      user-select: none;
      cursor: pointer;
      white-space: normal;
      word-break: break-word;
    }

    .log-word:hover {
      color: #ff3333 !important;
      -webkit-text-stroke: 1.5px #ff3333 !important;
      text-shadow: 0 0 15px rgba(255, 51, 51, 0.8);
    }

    /* Solid Mode */
    body.solid-style .log-word {
      color: #ffffff !important;
      -webkit-text-stroke: 0px transparent !important;
    }

    body.solid-style .log-word:hover {
      color: #ff3333 !important;
      -webkit-text-stroke: 0px transparent !important;
      text-shadow: 0 0 15px rgba(255, 51, 51, 0.9);
    }

    /* Drift Mode */
    @keyframes ambientDrift {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0px); }
    }

    body.drift-mode .log-row:nth-child(even) {
      animation: ambientDrift 4s ease-in-out infinite;
    }

    body.drift-mode .log-row:nth-child(odd) {
      animation: ambientDrift 5.5s ease-in-out infinite reverse;
    }

    /* Modals */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 3000;
      padding: 20px;
    }

    .modal-overlay.hidden {
      display: none !important;
    }

    .modal-card {
      background: #111111;
      padding: 30px;
      border: 1px solid #333333;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    }

    .modal-card h2 {
      font-family: Impact, sans-serif;
      letter-spacing: 1px;
      font-size: 1.3rem;
      color: #ffffff;
    }

    .modal-card label {
      display: block;
      margin-top: 15px;
      font-family: monospace;
      font-size: 0.75rem;
      color: #888888;
    }

    .modal-card input, 
    .modal-card textarea {
      width: 100%;
      background: #050505;
      border: 1px solid #333333;
      color: #ffffff;
      padding: 10px;
      margin-top: 5px;
      font-family: monospace;
      font-size: 0.9rem;
      border-radius: 2px;
    }

    .modal-card input:focus, 
    .modal-card textarea:focus {
      outline: none;
      border-color: #ff3333;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 25px;
    }

    .info-tag {
      font-family: monospace;
      font-size: 0.65rem;
      color: #ff3333;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .info-content {
      font-family: monospace;
      color: #dddddd;
      margin-top: 15px;
      font-size: 0.95rem;
      line-height: 1.5;
      background: #080808;
      padding: 15px;
      border-left: 2px solid #ff3333;
    }

    .info-actions {
      justify-content: space-between;
      align-items: center;
    }

    @media (max-width: 600px) {
      .panel-brand {
        display: none;
      }
      .btn {
        padding: 6px 10px;
        font-size: 0.7rem;
      }
      .modal-card {
        padding: 20px;
      }
    }
  </style>
</head>
<body>

  <!-- Overlay for drawer menu -->
  <div class="drawer-overlay" id="drawer-overlay"></div>

  <!-- Navigation Drawer (Hamburger Menu) -->
  <nav class="nav-drawer" id="nav-drawer" aria-label="Hoofdnavigatie">
    <button class="drawer-close" id="close-drawer" aria-label="Sluit menu">&times;</button>
    <div class="drawer-header">
      <div class="drawer-title">STREET LOGS</div>
      <div class="drawer-subtitle">URBAN OBSERVATION ARCHIVE</div>
    </div>

    <ul class="drawer-links">
      <li><a href="index.html" class="active" id="nav-typo"><span>01</span> TYPOGRAPHY LOG</a></li>
      <li><a href="photos.html" id="nav-photos"><span>02</span> PHOTO GALLERY</a></li>
      <li><a href="#" id="nav-archive"><span>03</span> ARCHIVE</a></li>
    </ul>

    <div class="drawer-footer">
      <span class="log-counter">LOGS ACTIEF: <strong id="drawer-log-count">0</strong></span>
    </div>
  </nav>

  <!-- Top Control Bar -->
  <header class="control-panel">
    <div class="panel-left">
      <button class="btn btn-icon" id="menu-toggle" aria-label="Open menu">
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
      </button>
      <span class="panel-brand">STREET OBSERVATIONS</span>
    </div>
    <div class="panel-actions">
      <button class="btn" id="toggle-style">SOLID / OUTLINE</button>
      <button class="btn" id="toggle-drift">DRIFT ANIMATION</button>
      <button class="btn btn-primary" id="toggle-modal">+ ADD OBS</button>
    </div>
  </header>

  <!-- Main Typography Display -->
  <main class="typography-container" id="log-display"></main>

  <!-- Modal: Observation Toevoegen -->
  <div class="modal-overlay hidden" id="observation-modal">
    <div class="modal-card">
      <h2>NIEUWE OBSERVATIE TOEVOEGEN</h2>
      <form id="add-log-form">
        <label for="input-day">DAG (BIJV. MON 5 OCT)</label>
        <input type="text" id="input-day" required placeholder="MON 5 OCT" autocomplete="off">

        <label for="input-time">TIJD (BIJV. 2AM)</label>
        <input type="text" id="input-time" required placeholder="2AM" autocomplete="off">

        <label for="input-text">OBSERVATIE TEKST</label>
        <textarea id="input-text" rows="4" required placeholder="BESCHRIJF DE SITUATIE IN HOOFDLETTERS..."></textarea>

        <div class="form-actions">
          <button type="button" class="btn" id="close-modal">ANNULEREN</button>
          <button type="submit" class="btn btn-primary">TOEVOEGEN</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Observation Info & Verwijderen -->
  <div class="modal-overlay hidden" id="info-modal">
    <div class="modal-card">
      <div class="info-tag">OBSERVATIE DETAILS</div>
      <h2 id="info-time">--</h2>
      <p id="info-text" class="info-content"></p>
      
      <div class="form-actions info-actions">
        <button type="button" class="btn btn-danger" id="delete-current-info">VERWIJDER OBSERVATIE</button>
        <button type="button" class="btn" id="close-info-modal">SLUITEN</button>
      </div>
    </div>
  </div>

  <script>
    const defaultObservations = [
      { day: "MON 5 OCT", time: "2AM", text: "5 PEOPLE WALKING NORTH TO SOUTH YELLING AND SINGING LOUD" },
      { day: "TUE 6 OCT", time: "10PM", text: "1 PERSON WALKING SOUTH TO NORTH STOPPED TO TIE SHOES" },
      { day: "WED 7 OCT", time: "8PM", text: "WALKING WITH LOUD MUSIC WEARING A RED HOODIE AND SLIPPERS" },
      { day: "THU 8 OCT", time: "1AM", text: "2 PEOPLE IN A HEATED ARGUMENT DRUNK WALKING IN THE MIDDLE OF ROAD" }
    ];

    let observations = JSON.parse(localStorage.getItem("street_observations_v4")) || defaultObservations;
    let selectedObservationIndex = null;

    document.addEventListener("DOMContentLoaded", () => {
      const menuToggle = document.getElementById("menu-toggle");
      const navDrawer = document.getElementById("nav-drawer");
      const closeDrawer = document.getElementById("close-drawer");
      const drawerOverlay = document.getElementById("drawer-overlay");

      function openMenu() {
        if (navDrawer) navDrawer.classList.add("open");
        if (drawerOverlay) drawerOverlay.classList.add("active");
      }

      function closeMenu() {
        if (navDrawer) navDrawer.classList.remove("open");
        if (drawerOverlay) drawerOverlay.classList.remove("active");
      }

      if (menuToggle) {
        menuToggle.addEventListener("click", (e) => {
          e.stopPropagation();
          openMenu();
        });
      }

      if (closeDrawer) closeDrawer.addEventListener("click", closeMenu);
      if (drawerOverlay) drawerOverlay.addEventListener("click", closeMenu);

      const container = document.getElementById("log-display");
      const drawerLogCount = document.getElementById("drawer-log-count");

      const toggleStyleBtn = document.getElementById("toggle-style");
      const toggleDriftBtn = document.getElementById("toggle-drift");

      const toggleAddModalBtn = document.getElementById("toggle-modal");
      const closeAddModalBtn = document.getElementById("close-modal");
      const addModal = document.getElementById("observation-modal");
      const addForm = document.getElementById("add-log-form");

      const infoModal = document.getElementById("info-modal");
      const infoTime = document.getElementById("info-time");
      const infoText = document.getElementById("info-text");
      const closeInfoModalBtn = document.getElementById("close-info-modal");
      const deleteCurrentInfoBtn = document.getElementById("delete-current-info");

      function renderLogs() {
        if (!container) return;
        container.innerHTML = "";

        if (drawerLogCount) {
          drawerLogCount.textContent = observations.length;
        }

        const totalRows = observations.length;

        if (totalRows === 0) {
          container.innerHTML = `
            <div style="font-family: monospace; color: #555; text-align: center; margin: auto; font-size: 0.9rem; letter-spacing: 1px;">
              GEEN OBSERVATIES BESCHIKBAAR.<br>KLIK OP "+ ADD OBS" OM EEN NIEUWE OBSERVATIE TOE TE VOEGEN.
            </div>`;
          return;
        }

        // Calculate dynamic base font-size to fill available space evenly
        const baseFontSize = Math.max(1.8, Math.min(5.5, (65 / totalRows) / 1.5));

        observations.forEach((item, index) => {
          const fullText = `${item.day} ${item.time} ${item.text}`;
          const words = fullText.split(" ");

          const row = document.createElement("div");
          row.className = "log-row";

          words.forEach(word => {
            const span = document.createElement("span");
            span.className = "log-word";
            span.style.setProperty("--dynamic-font-size", `${baseFontSize}vh`);
            span.textContent = word;

            span.addEventListener("click", () => {
              selectedObservationIndex = index;
              if (infoTime) infoTime.textContent = `${item.day} — ${item.time}`;
              if (infoText) infoText.textContent = item.text;
              if (infoModal) infoModal.classList.remove("hidden");
            });

            row.appendChild(span);
          });

          container.appendChild(row);
        });
      }

      function deleteObservation(index) {
        if (index !== null && index >= 0 && index < observations.length) {
          observations.splice(index, 1);
          localStorage.setItem("street_observations_v4", JSON.stringify(observations));
          renderLogs();
        }
      }

      if (deleteCurrentInfoBtn) {
        deleteCurrentInfoBtn.addEventListener("click", () => {
          if (selectedObservationIndex !== null) {
            deleteObservation(selectedObservationIndex);
            selectedObservationIndex = null;
            if (infoModal) infoModal.classList.add("hidden");
          }
        });
      }

      if (toggleStyleBtn) {
        toggleStyleBtn.addEventListener("click", () => {
          document.body.classList.toggle("solid-style");
          toggleStyleBtn.classList.toggle("active-mode");
        });
      }

      if (toggleDriftBtn) {
        toggleDriftBtn.addEventListener("click", () => {
          document.body.classList.toggle("drift-mode");
          toggleDriftBtn.classList.toggle("active-mode");
        });
      }

      if (toggleAddModalBtn && addModal) {
        toggleAddModalBtn.addEventListener("click", () => {
          addModal.classList.remove("hidden");
        });
      }

      if (closeAddModalBtn && addModal) {
        closeAddModalBtn.addEventListener("click", () => {
          addModal.classList.add("hidden");
        });
      }

      if (closeInfoModalBtn && infoModal) {
        closeInfoModalBtn.addEventListener("click", () => {
          infoModal.classList.add("hidden");
          selectedObservationIndex = null;
        });
      }

      if (addForm) {
        addForm.addEventListener("submit", (e) => {
          e.preventDefault();
          const day = document.getElementById("input-day").value.trim().toUpperCase();
          const time = document.getElementById("input-time").value.trim().toUpperCase();
          const text = document.getElementById("input-text").value.trim().toUpperCase();

          if (day && time && text) {
            observations.push({ day, time, text });
            localStorage.setItem("street_observations_v4", JSON.stringify(observations));

            renderLogs();
            addForm.reset();
            if (addModal) addModal.classList.add("hidden");
          }
        });
      }

      window.addEventListener("resize", renderLogs);
      renderLogs();
    });
  </script>
</body>
</html>
