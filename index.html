<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Street Observations - Typography</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation Drawer (Hamburger Menu) -->
  <nav class="nav-drawer" id="nav-drawer">
    <button class="drawer-close" id="close-drawer">&times;</button>
    <div class="drawer-title">NAVIGATIE</div>
    <ul class="drawer-links">
      <li><a href="#" class="active">Typography Log</a></li>
      <li><a href="#">Photo Gallery</a></li>
      <li><a href="#">Archive</a></li>
    </ul>
  </nav>

  <!-- Top Control Bar -->
  <header class="control-panel">
    <div class="panel-left">
      <button class="btn btn-icon" id="menu-toggle" aria-label="Menu">
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
      </button>
      <span class="panel-brand">STREET OBSERVATIONS</span>
    </div>
    <div class="panel-actions">
      <button class="btn" id="toggle-style">SOLID / OUTLINE</button>
      <button class="btn" id="toggle-drift">DRIFT ANIMATION</button>
      <button class="btn btn-primary" id="toggle-modal">+ ADD OBS</button>
      <button class="btn btn-danger" id="toggle-delete-modal">DELETE LOG</button>
    </div>
  </header>

  <!-- Main Typography Display -->
  <main class="typography-container" id="log-display"></main>

  <!-- Modal: Observation Toevoegen -->
  <div class="modal-overlay hidden" id="observation-modal">
    <div class="modal-card">
      <h2>NIEUWE OBSERVATIE TOEVOEGEN</h2>
      <form id="add-log-form">
        <label for="input-day">DAG (BIJV. FRI 9 OCT)</label>
        <input type="text" id="input-day" required placeholder="FRI 9 OCT">

        <label for="input-time">TIJD (BIJV. 11PM)</label>
        <input type="text" id="input-time" required placeholder="11PM">

        <label for="input-text">OBSERVATIE TEKST</label>
        <textarea id="input-text" rows="3" required placeholder="BESCHRIJF DE SITUATIE..."></textarea>

        <div class="form-actions">
          <button type="button" class="btn" id="close-modal">ANNULEREN</button>
          <button type="submit" class="btn btn-primary">TOEVOEGEN</button>
        </div>
      </form>
    </div>
  </div>
