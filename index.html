<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Street Observations — Typography Log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="page-typography">
  <div id="drawer-overlay" class="drawer-overlay"></div>

  <aside id="nav-drawer" class="nav-drawer" aria-label="Navigatie">
    <button type="button" id="close-drawer" class="drawer-close" aria-label="Sluit menu">&times;</button>
    <p class="drawer-title">STREET OBSERVATIONS</p>
    <ul class="drawer-links">
      <li><a href="index.html" class="active">TYPOGRAPHY LOG</a></li>
      <li><a href="photos.html">PHOTO GALLERY</a></li>
      <li><a href="editie05.html">Editie 05</a></li>
    </ul>
  </aside>

  <header class="control-panel">
    <div class="panel-left">
      <button type="button" id="menu-toggle" class="btn-icon" aria-label="Open menu">
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
      </button>
      <span class="panel-brand">STREET OBSERVATIONS</span>
    </div>

    <div class="panel-actions">
      <button type="button" id="toggle-style" class="btn">OUTLINE</button>
      <button type="button" id="toggle-drift" class="btn">DRIFT: OFF</button>
      <button type="button" id="open-add-modal" class="btn btn-primary">+ ADD LOG</button>
    </div>
  </header>

  <main id="typography-container" class="typography-container"></main>

  <div id="observation-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="add-modal-title">
    <div class="modal-card">
      <h2 id="add-modal-title">NEW OBSERVATION</h2>
      <form id="add-log-form">
        <label for="input-day">DATE</label>
        <input type="date" id="input-day" required />

        <label for="input-time">TIME</label>
        <input type="time" id="input-time" required />

        <label for="input-text">OBSERVATION</label>
        <textarea id="input-text" rows="3" placeholder="WHAT DID YOU SEE ON THE STREET?" required></textarea>

        <div class="form-actions">
          <button type="button" id="close-modal" class="btn">CANCEL</button>
          <button type="submit" class="btn btn-primary">SAVE</button>
        </div>
      </form>
    </div>
  </div>

  <div id="detail-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="detail-meta">
    <div class="modal-card">
      <div id="detail-meta" class="detail-meta"></div>
      <p id="detail-text" class="detail-text"></p>
      <div class="form-actions">
        <button type="button" id="delete-log-btn" class="btn btn-danger">DELETE</button>
        <button type="button" id="close-detail-modal" class="btn">CLOSE</button>
      </div>
    </div>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
