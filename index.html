<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>Street Observations - Typography</title>
  
  <!-- Google Pixel Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css?v=26">
</head>
<body>

  <!-- Navigation Drawer (Hamburger Menu) -->
  <nav class="nav-drawer" id="nav-drawer">
    <button class="drawer-close" id="close-drawer" aria-label="Close Menu">&times;</button>
    <div class="drawer-title">NAVIGATION</div>
    <ul class="drawer-links">
      <li><a href="index.html" class="active">Typography Log</a></li>
      <li><a href="photos.html">Photo Gallery</a></li>
      <li><a href="#">Archive</a></li>
    </ul>

    <div class="drawer-title" style="margin-top: 35px;">CONTROLS & ACTIONS</div>
    <div class="drawer-actions">
      <button class="btn drawer-btn" id="toggle-style">SOLID / OUTLINE</button>
      <button class="btn drawer-btn" id="toggle-drift">DRIFT ANIMATION</button>
      <button class="btn drawer-btn btn-primary" id="toggle-modal">+ ADD OBSERVATION</button>
    </div>
  </nav>

  <!-- Top Control Bar (Minimalist) -->
  <header class="control-panel">
    <div class="panel-left">
      <button class="btn btn-icon" id="menu-toggle" aria-label="Open Menu">
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
      </button>
      <span class="panel-brand">STREET OBSERVATIONS</span>
    </div>
  </header>

  <!-- Main Typography Display -->
  <main class="typography-container" id="log-display"></main>

  <!-- Mobile Swipe Indicator -->
  <div class="swipe-hint" id="swipe-hint">SWIPE LEFT/RIGHT ➔</div>

  <!-- Modal: Add / Edit Observation -->
  <div class="modal-overlay hidden" id="observation-modal">
    <div class="modal-card">
      <h2 id="modal-title">ADD NEW OBSERVATION</h2>
      <form id="add-log-form">
        <label for="input-day">DAY (E.G. FRI 9 OCT)</label>
        <input type="text" id="input-day" required placeholder="FRI 9 OCT">

        <label for="input-time">TIME (E.G. 11PM)</label>
        <input type="text" id="input-time" required placeholder="11PM">

        <label for="input-text">OBSERVATION TEXT</label>
        <textarea id="input-text" rows="3" required placeholder="DESCRIBE THE SITUATION..."></textarea>

        <div class="form-actions">
          <button type="button" class="btn" id="close-modal">CANCEL</button>
          <button type="submit" class="btn btn-primary" id="form-submit-btn">ADD</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Observation Details -->
  <div class="modal-overlay hidden" id="info-modal">
    <div class="modal-card">
      <h2 id="info-time">--</h2>
      <p id="info-text" style="font-family: monospace; color: #ccc; margin-top: 15px;"></p>
      
      <div class="form-actions" style="justify-content: space-between; align-items: center; margin-top: 25px; flex-wrap: wrap; gap: 10px;">
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
          <button type="button" class="btn btn-danger" id="delete-current-info">DELETE</button>
          <button type="button" class="btn btn-primary" id="edit-current-info">EDIT OBSERVATION</button>
        </div>
        <button type="button" class="btn" id="close-info-modal">CLOSE</button>
      </div>
    </div>
  </div>

  <script src="script.js?v=26"></script>
</body>
</html>
