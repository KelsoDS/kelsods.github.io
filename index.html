<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Street Observations - Typography Log</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Overlay for drawer menu -->
  <div class="drawer-overlay" id="drawer-overlay"></div>

  <!-- Navigation Drawer (Hamburger Menu) -->
  <nav class="nav-drawer" id="nav-drawer" aria-label="Hoofdnavigatie">
    <button class="drawer-close" id="close-drawer" aria-label="Sluit menu">&times;</button>
    <div class="drawer-header">
      <div class="drawer-title">STREET LOGS</div>
      <div class="drawer-subtitle">URBAN OBSERVATION ARCHIVE</div>
    </div>

    <ul class="drawer-links">
      <li><a href="#" class="active" id="nav-typo"><span>01</span> TYPOGRAPHY LOG</a></li>
      <li><a href="#" id="nav-photos"><span>02</span> PHOTO GALLERY</a></li>
      <li><a href="#" id="nav-archive"><span>03</span> ARCHIVE</a></li>
    </ul>

    <div class="drawer-footer">
      <span class="log-counter">LOGS ACTIEF: <strong id="drawer-log-count">0</strong></span>
    </div>
  </nav>

  <!-- Top Control Bar -->
  <header class="control-panel">
    <div class="panel-left">
      <button class="btn btn-icon" id="menu-toggle" aria-label="Open menu">
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
      </button>
      <span class="panel-brand">STREET OBSERVATIONS</span>
    </div>
    <div class="panel-actions">
      <button class="btn" id="toggle-style">SOLID / OUTLINE</button>
      <button class="btn" id="toggle-drift">DRIFT ANIMATION</button>
      <button class="btn btn-primary" id="toggle-modal">+ ADD OBS</button>
    </div>
  </header>

  <!-- Main Typography Display -->
  <main class="typography-container" id="log-display"></main>

  <!-- Modal: Observation Toevoegen -->
  <div class="modal-overlay hidden" id="observation-modal">
    <div class="modal-card">
      <h2>NIEUWE OBSERVATIE TOEVOEGEN</h2>
      <form id="add-log-form">
        <label for="input-day">DAG (BIJV. MON 5 OCT)</label>
        <input type="text" id="input-day" required placeholder="MON 5 OCT" autocomplete="off">

        <label for="input-time">TIJD (BIJV. 2AM)</label>
        <input type="text" id="input-time" required placeholder="2AM" autocomplete="off">

        <label for="input-text">OBSERVATIE TEKST</label>
        <textarea id="input-text" rows="4" required placeholder="BESCHRIJF DE SITUATIE IN HOOFDLETTERS..."></textarea>

        <div class="form-actions">
          <button type="button" class="btn" id="close-modal">ANNULEREN</button>
          <button type="submit" class="btn btn-primary">TOEVOEGEN</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Observation Info & Verwijderen -->
  <div class="modal-overlay hidden" id="info-modal">
    <div class="modal-card">
      <div class="info-tag">OBSERVATIE DETAILS</div>
      <h2 id="info-time">--</h2>
      <p id="info-text" class="info-content"></p>
      
      <div class="form-actions info-actions">
        <button type="button" class="btn btn-danger" id="delete-current-info">VERWIJDER OBSERVATIE</button>
        <button type="button" class="btn" id="close-info-modal">SLUITEN</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
