<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Street Observations — Typographic Log</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <!-- Floating Control Panel -->
  <header class="control-panel">
    <div class="panel-left">
      <!-- Hamburger Menu Button -->
      <button id="menu-toggle" class="btn btn-icon" type="button" aria-label="Toggle Menu">
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
      </button>
      <div class="panel-brand">OBSERVATION LOG v1.0</div>
    </div>

    <div class="panel-actions">
      <button id="toggle-style" class="btn" type="button">OUTLINE / SOLID</button>
      <button id="toggle-drift" class="btn" type="button">ANIMATION</button>
      <button id="toggle-modal" class="btn btn-primary" type="button">+ ADD LOG</button>
    </div>
  </header>

  <!-- Navigation Drawer (Hamburger Menu) -->
  <nav id="nav-drawer" class="nav-drawer">
    <button id="close-drawer" class="drawer-close" type="button">&times;</button>
    <div class="drawer-title">PAGES</div>
    <ul class="drawer-links">
      <li><a href="index.html" class="active">01. TYPOGRAPHY</a></li>
      <li><a href="photos.html">02. PHOTOGRAPHS</a></li>
      <li><a href="#">03. PAGE THREE</a></li>
      <li><a href="#">04. PAGE FOUR</a></li>
      <li><a href="#">05. PAGE FIVE</a></li>
      <li><a href="#">06. PAGE SIX</a></li>
      <li><a href="#">07. PAGE SEVEN</a></li>
      <li><a href="#">08. PAGE EIGHT</a></li>
      <li><a href="#">09. PAGE NINE</a></li>
      <li><a href="#">10. PAGE TEN</a></li>
    </ul>
  </nav>

  <!-- Typography Canvas -->
  <main class="typography-container" id="log-display">
    <!-- Rendered dynamically via script.js -->
  </main>

  <!-- Modal for adding new observations -->
  <div id="observation-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <h2>ADD NEW OBSERVATION</h2>
      <form id="add-log-form">
        <label for="input-day">DAY & DATE (E.G. MON 5 OCT):</label>
        <input type="text" id="input-day" required placeholder="MON 5 OCT">

        <label for="input-time">TIME (E.G. 2AM / 14:30):</label>
        <input type="text" id="input-time" required placeholder="2AM">

        <label for="input-text">OBSERVATION DETAILS:</label>
        <textarea id="input-text" rows="4" required placeholder="5 PEOPLE WALKING NORTH TO SOUTH YELLING AND SINGING LOUD"></textarea>

        <div class="form-actions">
          <button type="button" id="close-modal" class="btn">CANCEL</button>
          <button type="submit" class="btn btn-primary">SUBMIT</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Detail Information Modal -->
  <div id="info-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <h2 id="info-title">OBSERVATION DETAILS</h2>
      <p id="info-time" style="font-family: monospace; color: #ff3333; margin-bottom: 10px;"></p>
      <p id="info-text" style="font-family: monospace; line-height: 1.5; color: #ffffff;"></p>
      <div class="form-actions">
        <button type="button" id="close-info-modal" class="btn btn-primary">CLOSE</button>
      </div>
    </div>
  </div>

</body>
</html>
